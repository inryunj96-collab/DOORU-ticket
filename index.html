<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14213d" />
  <title>⚾ 두루두루 티켓 배부 ⚾</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <button id="btn-back" class="icon-btn" hidden aria-label="뒤로가기">‹</button>
    <h1 class="app-title">⚾ 두루두루 티켓 배부 ⚾</h1>
    <button id="btn-theme" class="icon-btn" aria-label="테마 변경">🎨</button>
  </header>
  <div id="theme-menu" class="theme-menu" hidden>
    <button class="theme-option" data-theme="default">기본</button>
    <button class="theme-option" data-theme="warm">따뜻함</button>
    <button class="theme-option" data-theme="cool">차가움</button>
  </div>

  <main id="app" class="app-main"></main>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
